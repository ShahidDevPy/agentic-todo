name: PR Quality

on:
  pull_request:
    branches:
      - "**"

# Prisma postinstall + Next build import env at compile time; no live DB connection needed.
env:
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-anon-key

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Build
        run: npm run build
